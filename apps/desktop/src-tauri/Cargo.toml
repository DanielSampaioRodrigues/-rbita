[package]
name = "orbita"
version = "0.5.0"
description = "Órbita — organizador de vida para pessoas neurodivergentes"
authors = ["Daniel Sampaio Rodrigues"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "orbita_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hex = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
unicode-normalization = "0.1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

# A derivação de chave (Argon2) fica lenta demais sem otimização, até nos testes.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
