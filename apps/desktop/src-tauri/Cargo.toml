[package]
name = "orbita"
version = "0.42.0"
description = "Órbita — organizador de vida para pessoas neurodivergentes"
authors = ["Daniel Sampaio Rodrigues"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "orbita_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hex = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
unicode-normalization = "0.1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Conversa com os provedores de IA (só quando a pessoa liga a IA).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Ditado local: transcrição com whisper.cpp (o modelo é baixado à parte).
whisper-rs = "0.16"
sha1 = "0.10"
base64 = "0.22"

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.4"
# Atualização dentro do app (só no computador; no celular, as lojas cuidam disso).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
keyring = { version = "3.6", features = ["windows-native"] }
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_SystemInformation"] }
windows-future = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

# A derivação de chave (Argon2) fica lenta demais sem otimização, até nos testes.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
