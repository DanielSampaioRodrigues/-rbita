[package]
name = "orbita-motor-web"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.41", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
hex = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "js"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
base64 = "0.22"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
# Backup portátil e envelopes (os mesmos do Windows: src-tauri/src/portatil.rs e cofre/).
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
# Comprime o retrato da sincronização (o mesmo do Windows).
miniz_oxide = "0.8"
rand = "0.8"
# O rand 0.8 usa o getrandom 0.2, que no navegador precisa da opção "js".
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[build-dependencies]
regex = "1"

# Menor download para o navegador.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# O Argon2 fica lento demais com opt-level "z" (o tempo de abrir com a senha conta mais que alguns KB).
[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
