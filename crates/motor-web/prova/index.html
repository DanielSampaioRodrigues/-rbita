<!doctype html><meta charset="utf-8"><body><pre id="r">...</pre>
<script type="module">
import init, * as m from "./orbita_motor_web.js";
const r = document.getElementById("r");
try {
  await init();
  const t0 = performance.now();
  const versao = m.abrir_em_memoria();
  m.criar_ideia("Comprar tinta para o caderno");
  m.criar_ideia("Ideia com acento: ação, coração, órbita");
  for (let i = 0; i < 500; i++) m.criar_ideia("ideia " + i);
  const lista = JSON.parse(m.listar_ideias());
  const ms = Math.round(performance.now() - t0);
  const cipher = m.versao_cipher();
  const reabrir = JSON.parse(m.exportar_e_reabrir());
  r.textContent = JSON.stringify({ ok: true, versaoDoBanco: versao, total: lista.length, ms, cipher, reabrir });
} catch (e) { r.textContent = JSON.stringify({ ok: false, erro: String(e) }); }
</script>
