# Monta o instalador do Órbita para Windows na branch principal ou sob demanda
# (para poupar minutos do Actions; o runner Windows custa o dobro). Em toda
# branch de trabalho, roda só o teste leve do Rust no Linux.
# O instalador aparece em "Artifacts" na página da execução, no GitHub.
#
# Sob demanda, dá para escolher o que montar: o instalador do Windows (padrão),
# a versão de navegador (iPad), ou os dois. A de navegador usa só a máquina
# Linux, que é barata.
name: Instalador Windows

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      alvo:
        description: "O que montar e publicar"
        type: choice
        options: [windows, navegador, ambos]
        default: windows

# Se chegar um envio novo, cancela o build antigo para poupar minutos.
concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testes da parte nativa (cofre, criptografia, banco). Linux sai mais barato.
  testes-nativos:
    # Só a versão de navegador pedida à mão não precisa dos testes nativos.
    if: github.event_name != 'workflow_dispatch' || inputs.alvo != 'navegador'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Instalar bibliotecas do sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      # O alvo wasm32 serve só para o passo do motor de navegador, logo abaixo.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            crates/motor-web

      # O build da parte nativa precisa da pasta da interface, mesmo vazia.
      - name: Preparar pasta da interface
        run: mkdir -p apps/desktop/dist

      - name: Rodar testes
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # Barato: só compila o motor do navegador (sem wasm-bindgen). A ponte é
      # gerada de comandos.rs; se um comando novo do Windows quebrar a ponte,
      # o erro aparece aqui, e não só na hora de publicar o navegador.
      - name: Compilar o motor do navegador (wasm)
        working-directory: crates/motor-web
        run: cargo build --target wasm32-unknown-unknown

  # O instalador roda num runner Windows, que gasta minuto em dobro. Para
  # poupar os minutos do Actions, ele só é montado na branch principal ou
  # quando a gente pede à mão (workflow_dispatch). Em todo push de trabalho,
  # roda só o teste leve do Rust no Linux (job acima), que é barato.
  windows:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.alvo != 'navegador')
    runs-on: windows-latest
    timeout-minutes: 45
    # Ditado: o whisper.cpp é compilado para processadores comuns (AVX2, de 2013
    # em diante), e não para o processador da máquina do GitHub, que pode ter
    # instruções que o computador da pessoa não tem.
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Rodar testes
        run: pnpm test

      # A chave assina o instalador; o app só instala atualização com assinatura válida.
      - name: Montar instalador
        run: pnpm instalador
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Identificadores do Órbita no Google e na Microsoft (login com conta).
          # Sem eles, a opção "Guardar na minha conta" não aparece.
          ORBITA_GOOGLE_CLIENT_ID: ${{ secrets.ORBITA_GOOGLE_CLIENT_ID }}
          ORBITA_GOOGLE_CLIENT_SECRET: ${{ secrets.ORBITA_GOOGLE_CLIENT_SECRET }}
          ORBITA_MICROSOFT_CLIENT_ID: ${{ secrets.ORBITA_MICROSOFT_CLIENT_ID }}

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Orbita-instalador-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

      # Atualização dentro do app: quando a versão muda, publica no repositório
      # público orbita-versoes o instalador, a assinatura e o latest.json que o
      # Órbita consulta. Versão que já existe lá não é publicada de novo.
      - name: Publicar versão nova
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_VERSOES }}
        run: |
          REPO=DanielSampaioRodrigues/orbita-versoes
          VERSAO=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          TAG="v$VERSAO"
          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            echo "A versão $TAG já está publicada; nada a fazer."
            exit 0
          fi
          EXE=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          NOME="Orbita_${VERSAO}_x64-setup.exe"
          mkdir -p publicar
          cp "$EXE" "publicar/$NOME"
          node apps/desktop/scripts/latest-json.mjs "$VERSAO" "https://github.com/$REPO/releases/download/$TAG/$NOME" "$EXE.sig" apps/desktop/notas-da-versao.md > publicar/latest.json
          gh release create "$TAG" "publicar/$NOME" publicar/latest.json -R "$REPO" --title "Órbita $VERSAO" --notes-file apps/desktop/notas-da-versao.md

  # Versão de navegador (iPad): publica os arquivos prontos do app no
  # repositório público orbita-versoes, na subpasta app/ da branch que o
  # GitHub Pages já serve (a mesma da página inicial e da de privacidade):
  # https://danielsampaiorodrigues.github.io/orbita-versoes/app/
  # Só troca a pasta app/; o resto do site fica como está. O código-fonte
  # continua aqui, no privado; os dados de quem usa ficam no próprio aparelho.
  # Não mexe nas versões do Windows (que vêm das Releases).
  navegador:
    if: github.event_name == 'workflow_dispatch' && (inputs.alvo == 'navegador' || inputs.alvo == 'ambos')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_REPO: DanielSampaioRodrigues/orbita-versoes
      SITE_BRANCH: claude/orbita-setup-planning-cfbqzz
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Rodar testes
        run: pnpm test

      # Motor do navegador: o mesmo banco do Windows, em WebAssembly. O
      # wasm-bindgen-cli precisa ser da MESMA versão da crate wasm-bindgen em
      # crates/motor-web/Cargo.lock (hoje 0.2.130); ao atualizar uma, atualize a outra.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/motor-web

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Montar o motor do navegador
        working-directory: apps/desktop
        run: pnpm motor

      - name: Montar a versão de navegador
        working-directory: apps/desktop
        env:
          VITE_ORBITA_WEB: "1"
        run: pnpm exec vite build

      - name: Publicar em app/ no site do orbita-versoes
        env:
          GH_TOKEN: ${{ secrets.TOKEN_VERSOES }}
        run: |
          VERSAO=$(node -p "require('./apps/desktop/package.json').version")
          git clone -q --depth 1 --branch "$SITE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${SITE_REPO}.git" site
          rm -rf site/app
          mkdir site/app
          cp -r apps/desktop/dist-web/. site/app/
          cd site
          git add -A app
          if git diff --cached --quiet; then
            echo "A versão de navegador $VERSAO já está publicada; nada a fazer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Versão de navegador $VERSAO em /app"
          git push -q origin "HEAD:$SITE_BRANCH"
          echo "Publicada em https://danielsampaiorodrigues.github.io/orbita-versoes/app/"
