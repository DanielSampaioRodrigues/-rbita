# Monta o instalador do Órbita para Windows a cada envio de código.
# O instalador aparece em "Artifacts" na página da execução, no GitHub.
name: Instalador Windows

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# Se chegar um envio novo, cancela o build antigo para poupar minutos.
concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testes da parte nativa (cofre, criptografia, banco). Linux sai mais barato.
  testes-nativos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Instalar bibliotecas do sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # O build da parte nativa precisa da pasta da interface, mesmo vazia.
      - name: Preparar pasta da interface
        run: mkdir -p apps/desktop/dist

      - name: Rodar testes
        working-directory: apps/desktop/src-tauri
        run: cargo test

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    # Ditado: o whisper.cpp é compilado para processadores comuns (AVX2, de 2013
    # em diante), e não para o processador da máquina do GitHub, que pode ter
    # instruções que o computador da pessoa não tem.
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Rodar testes
        run: pnpm test

      # A chave assina o instalador; o app só instala atualização com assinatura válida.
      - name: Montar instalador
        run: pnpm instalador
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Identificadores do Órbita no Google e na Microsoft (login com conta).
          # Sem eles, a opção "Guardar na minha conta" não aparece.
          ORBITA_GOOGLE_CLIENT_ID: ${{ secrets.ORBITA_GOOGLE_CLIENT_ID }}
          ORBITA_GOOGLE_CLIENT_SECRET: ${{ secrets.ORBITA_GOOGLE_CLIENT_SECRET }}
          ORBITA_MICROSOFT_CLIENT_ID: ${{ secrets.ORBITA_MICROSOFT_CLIENT_ID }}

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Orbita-instalador-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

      # Atualização dentro do app: quando a versão muda, publica no repositório
      # público orbita-versoes o instalador, a assinatura e o latest.json que o
      # Órbita consulta. Versão que já existe lá não é publicada de novo.
      - name: Publicar versão nova
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_VERSOES }}
        run: |
          REPO=DanielSampaioRodrigues/orbita-versoes
          VERSAO=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          TAG="v$VERSAO"
          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            echo "A versão $TAG já está publicada; nada a fazer."
            exit 0
          fi
          EXE=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          NOME="Orbita_${VERSAO}_x64-setup.exe"
          mkdir -p publicar
          cp "$EXE" "publicar/$NOME"
          node apps/desktop/scripts/latest-json.mjs "$VERSAO" "https://github.com/$REPO/releases/download/$TAG/$NOME" "$EXE.sig" apps/desktop/notas-da-versao.md > publicar/latest.json
          gh release create "$TAG" "publicar/$NOME" publicar/latest.json -R "$REPO" --title "Órbita $VERSAO" --notes-file apps/desktop/notas-da-versao.md
